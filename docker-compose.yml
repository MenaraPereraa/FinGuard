services:
  postgres:
    image: postgres:17
    container_name: finguard_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Mena2005
      POSTGRES_DB: finguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: